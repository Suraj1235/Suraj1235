<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 84 84" width="168" height="168">
  <!-- the WNE3 mosaic, building itself: threads trace each tile (row-major, the
       glyph's own stroke order), ink floods, one breath of colour passes through
       (lit tiles -> deep blue, ground tiles -> sky), the mark stamps, rests,
       dissolves, and builds itself again. 8s, seamless. -->
  <style>
    .g {
      animation: master 8s ease-in-out infinite;
      transform-origin: 42px 42px;
    }
    rect { stroke-width: 2.3; fill-opacity: 0; stroke-opacity: 0; transform-box: fill-box; transform-origin: center; }
    .lit  { fill: #e8e8e4; stroke: #e8e8e4; }
    .deep { fill: #4a4a47; stroke: #4a4a47; }
    @keyframes master {
      0%      { opacity: 0; transform: scale(1); }
      3%      { opacity: 1; }
      70%     { transform: scale(1); }
      72.5%   { transform: scale(1.05); }
      74.5%   { transform: scale(0.982); }
      76.5%   { transform: scale(1); }
      90%     { opacity: 1; }
      96.5%   { opacity: 0; }
      100%    { opacity: 0; transform: scale(1); }
    }
    .t0 { animation: k0 8s ease-in-out infinite; } .t1 { animation: k1 8s ease-in-out infinite; }
    .t2 { animation: k2 8s ease-in-out infinite; } .t3 { animation: k3 8s ease-in-out infinite; }
    .t4 { animation: k4 8s ease-in-out infinite; } .t5 { animation: k5 8s ease-in-out infinite; }
    .t6 { animation: k6 8s ease-in-out infinite; } .t7 { animation: k7 8s ease-in-out infinite; }
    .t8 { animation: k8 8s ease-in-out infinite; }
    @keyframes k0 { 0%,3%{stroke-dashoffset:74;fill-opacity:0;stroke-opacity:.95} 8.5%{stroke-dashoffset:0} 11.5%{fill-opacity:1} 15.5%{stroke-opacity:0} 46%{fill:#e8e8e4} 48.5%{fill:#2e5bff} 55%{fill:#e8e8e4} 100%{stroke-dashoffset:0;fill-opacity:1;stroke-opacity:0} }
    @keyframes k1 { 0%,6.1%{stroke-dashoffset:74;fill-opacity:0;stroke-opacity:.95} 11.6%{stroke-dashoffset:0} 14.6%{fill-opacity:1} 18.6%{stroke-opacity:0} 47.6%{fill:#e8e8e4} 50.1%{fill:#2e5bff} 56.6%{fill:#e8e8e4} 100%{stroke-dashoffset:0;fill-opacity:1;stroke-opacity:0} }
    @keyframes k2 { 0%,9.2%{stroke-dashoffset:74;fill-opacity:0;stroke-opacity:.95} 14.7%{stroke-dashoffset:0} 17.7%{fill-opacity:1} 21.7%{stroke-opacity:0} 49.2%{fill:#4a4a47} 51.7%{fill:#00bfff} 58.2%{fill:#4a4a47} 100%{stroke-dashoffset:0;fill-opacity:1;stroke-opacity:0} }
    @keyframes k3 { 0%,12.3%{stroke-dashoffset:74;fill-opacity:0;stroke-opacity:.95} 17.8%{stroke-dashoffset:0} 20.8%{fill-opacity:1} 24.8%{stroke-opacity:0} 50.8%{fill:#4a4a47} 53.3%{fill:#00bfff} 59.8%{fill:#4a4a47} 100%{stroke-dashoffset:0;fill-opacity:1;stroke-opacity:0} }
    @keyframes k4 { 0%,15.4%{stroke-dashoffset:74;fill-opacity:0;stroke-opacity:.95} 20.9%{stroke-dashoffset:0} 23.9%{fill-opacity:1} 27.9%{stroke-opacity:0} 52.4%{fill:#e8e8e4} 54.9%{fill:#2e5bff} 61.4%{fill:#e8e8e4} 100%{stroke-dashoffset:0;fill-opacity:1;stroke-opacity:0} }
    @keyframes k5 { 0%,18.5%{stroke-dashoffset:74;fill-opacity:0;stroke-opacity:.95} 24%{stroke-dashoffset:0} 27%{fill-opacity:1} 31%{stroke-opacity:0} 54%{fill:#e8e8e4} 56.5%{fill:#2e5bff} 63%{fill:#e8e8e4} 100%{stroke-dashoffset:0;fill-opacity:1;stroke-opacity:0} }
    @keyframes k6 { 0%,21.6%{stroke-dashoffset:74;fill-opacity:0;stroke-opacity:.95} 27.1%{stroke-dashoffset:0} 30.1%{fill-opacity:1} 34.1%{stroke-opacity:0} 55.6%{fill:#4a4a47} 58.1%{fill:#00bfff} 64.6%{fill:#4a4a47} 100%{stroke-dashoffset:0;fill-opacity:1;stroke-opacity:0} }
    @keyframes k7 { 0%,24.7%{stroke-dashoffset:74;fill-opacity:0;stroke-opacity:.95} 30.2%{stroke-dashoffset:0} 33.2%{fill-opacity:1} 37.2%{stroke-opacity:0} 57.2%{fill:#e8e8e4} 59.7%{fill:#2e5bff} 66.2%{fill:#e8e8e4} 100%{stroke-dashoffset:0;fill-opacity:1;stroke-opacity:0} }
    @keyframes k8 { 0%,27.8%{stroke-dashoffset:74;fill-opacity:0;stroke-opacity:.95} 33.3%{stroke-dashoffset:0} 36.3%{fill-opacity:1} 40.3%{stroke-opacity:0} 58.8%{fill:#e8e8e4} 61.3%{fill:#2e5bff} 67.8%{fill:#e8e8e4} 100%{stroke-dashoffset:0;fill-opacity:1;stroke-opacity:0} }
  </style>
  <g class="g">
    <!-- WNE3_MOSAIC_PATTERN: lit lit deep / deep lit lit / deep lit lit -->
    <rect class="lit t0"  x="6"  y="6"  width="20" height="20" rx="4.5" stroke-dasharray="74"/>
    <rect class="lit t1"  x="32" y="6"  width="20" height="20" rx="4.5" stroke-dasharray="74"/>
    <rect class="deep t2" x="58" y="6"  width="20" height="20" rx="4.5" stroke-dasharray="74"/>
    <rect class="deep t3" x="6"  y="32" width="20" height="20" rx="4.5" stroke-dasharray="74"/>
    <rect class="lit t4"  x="32" y="32" width="20" height="20" rx="4.5" stroke-dasharray="74"/>
    <rect class="lit t5"  x="58" y="32" width="20" height="20" rx="4.5" stroke-dasharray="74"/>
    <rect class="deep t6" x="6"  y="58" width="20" height="20" rx="4.5" stroke-dasharray="74"/>
    <rect class="lit t7"  x="32" y="58" width="20" height="20" rx="4.5" stroke-dasharray="74"/>
    <rect class="lit t8"  x="58" y="58" width="20" height="20" rx="4.5" stroke-dasharray="74"/>
  </g>
</svg>
